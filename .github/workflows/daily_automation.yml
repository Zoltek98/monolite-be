name: Casa Boschetto Daily Automation

on:
  schedule:
    # Gira alle 08:00 UTC (8:00 in Italia)
    - cron: '0 7 * * *'
  workflow_dispatch: # Per lanciarlo a mano

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install axios pg imapflow

      - name: 📧 Controllo Bollette (Email)
        run: node scripts/mail-checker.js
        env:
          EMAIL: ${{ secrets.EMAIL }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          # Usiamo direttamente la stringa di Neon per comodità
          DATABASE_URL: ${{ secrets.DATABASE_URL }} 

      - name: 📈 Aggiornamento Investimenti (Alpha Vantage)
        run: node scripts/update-prices.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Se vuoi proteggere la tua chiave Alpha Vantage, mettila nei secrets!
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}