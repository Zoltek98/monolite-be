name: 📧 Daily Email Automation

on:
  schedule:
    # Gira ogni giorno alle 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch: 

jobs:
  check-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install axios pg imapflow

      - name: 📧 Controllo Bollette (Email)
        run: node scripts/mail-checker.js
        env:
          EMAIL: ${{ secrets.EMAIL }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}